apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-project-access
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/managed-by: pipeline-core
    ports:
    # Service port 9000 is forwarded to the SeaweedFS container port 8333;
    # NetworkPolicy ports are evaluated after this DNAT.
    - port: 8333
      protocol: TCP
