apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline
spec:
  template:
    spec:
      containers:
      - name: ml-pipeline-api-server
        command:
        - /bin/sh
        - -c
        args:
        - /bin/apiserver --config=/config -logtostderr=true --logLevel=${LOG_LEVEL}
        env:
        - $patch: replace
        - name: PUBLISH_LOGS
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        - name: PIPELINE_LOG_LEVEL
          value: "1"
        - name: AUTO_UPDATE_PIPELINE_DEFAULT_VERSION
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: autoUpdatePipelineDefaultVersion
              optional: true
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_DOMAIN
          value: "cluster.local"
        - name: OBJECTSTORECONFIG_SECURE
          value: "false"
        - name: OBJECTSTORECONFIG_BUCKETNAME
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: bucketName
              optional: true
        - name: OBJECTSTORECONFIG_HOST
          value: "seaweedfs.kubeflow"
        - name: OBJECTSTORECONFIG_PORT
          value: "9000"
        - name: DBCONFIG_CONMAXLIFETIME
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: ConMaxLifeTime
              optional: true
        - name: DBDRIVERNAME
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: dbType
              optional: true
        # PostgreSQL Config
        - name: DBCONFIG_POSTGRESQLCONFIG_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret-extended
              key: username
        - name: DBCONFIG_POSTGRESQLCONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret-extended
              key: password
        - name: DBCONFIG_POSTGRESQLCONFIG_DBNAME
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: pipelineDb
              optional: true
        - name: DBCONFIG_POSTGRESQLCONFIG_HOST
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: postgresHost
              optional: true
        - name: DBCONFIG_POSTGRESQLCONFIG_PORT
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: postgresPort
              optional: true
        # end of PostgreSQL variables
        - name: OBJECTSTORECONFIG_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: mlpipeline-minio-artifact
              key: accesskey
        - name: OBJECTSTORECONFIG_SECRETACCESSKEY
          valueFrom:
            secretKeyRef:
              name: mlpipeline-minio-artifact
              key: secretkey
        - name: V2_DRIVER_IMAGE
          value: ghcr.io/kubeflow/kfp-driver:2.16.1
        - name: V2_LAUNCHER_IMAGE
          value: ghcr.io/kubeflow/kfp-launcher:2.16.1
        - name: COMPILED_PIPELINE_SPEC_PATCH
          value: "{}"
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_USER
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: defaultSecurityContextRunAsUser
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_GROUP
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: defaultSecurityContextRunAsGroup
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_NON_ROOT
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: defaultSecurityContextRunAsNonRoot
              optional: true
