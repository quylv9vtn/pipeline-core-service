apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: ml-pipeline
  name: ml-pipeline-project-provisioner
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - secrets
  verbs:
  - create
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - get
# Kubernetes prevents privilege escalation when creating a RoleBinding. The
# provisioner may bind only the namespace-scoped runner role used by projects.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - pipeline-runner
  verbs:
  - bind
